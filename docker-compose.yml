version: '3.8'

services:
  # ─── Firebase Emulator ──────────────────────────────────────────────
  firebase-emulator:
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -c "
        npm install -g firebase-tools &&
        firebase emulators:start --project play-tn
      "
    ports:
      - '4000:4000'   # Emulator UI
      - '8080:8080'   # Firestore
      - '9099:9099'   # Auth
      - '9199:9199'   # Storage
    volumes:
      - ./firebase.json:/app/firebase.json
      - firebase-data:/app/data
    environment:
      - FIREBASE_PROJECT_ID=play-tn
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:4000']
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── User API ───────────────────────────────────────────────────────
  user-api:
    build:
      context: ./apps/user-api
      dockerfile: Dockerfile
    ports:
      - '4001:4001'
    environment:
      - PORT=4001
      - NODE_ENV=development
      - FIREBASE_PROJECT_ID=play-tn
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - CORS_ORIGIN=http://localhost:3000
      - GCS_BUCKET_NAME=play-tn-media
    depends_on:
      firebase-emulator:
        condition: service_healthy
    volumes:
      - ./apps/user-api/src:/app/src
    restart: unless-stopped

  # ─── Admin API ──────────────────────────────────────────────────────
  admin-api:
    build:
      context: ./apps/admin-api
      dockerfile: Dockerfile
    ports:
      - '4002:4002'
    environment:
      - PORT=4002
      - NODE_ENV=development
      - FIREBASE_PROJECT_ID=play-tn
      - FIRESTORE_EMULATOR_HOST=firebase-emulator:8080
      - FIREBASE_AUTH_EMULATOR_HOST=firebase-emulator:9099
      - CORS_ORIGIN=http://localhost:5173
      - GCS_BUCKET_NAME=play-tn-media
    depends_on:
      firebase-emulator:
        condition: service_healthy
    volumes:
      - ./apps/admin-api/src:/app/src
    restart: unless-stopped

  # ─── Storefront (Next.js) ──────────────────────────────────────────
  storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=play-tn
      - NEXT_PUBLIC_FIREBASE_API_KEY=demo-api-key
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=localhost:9099
    depends_on:
      - user-api
    restart: unless-stopped

  # ─── Admin (Vite) ──────────────────────────────────────────────────
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:4002
      - VITE_FIREBASE_PROJECT_ID=play-tn
      - VITE_FIREBASE_API_KEY=demo-api-key
      - VITE_FIREBASE_AUTH_DOMAIN=localhost:9099
    depends_on:
      - admin-api
    restart: unless-stopped

volumes:
  firebase-data:
